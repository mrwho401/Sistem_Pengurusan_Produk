<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pengurusan Produk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>SISTEM PENGURUSAN PRODUK</h1>

        <div class="form-container">
            <h3>Tambah Produk Baharu</h3>
            <form id="productForm">
                <input type="text" id="productName" placeholder="Nama Produk" required>
                <input type="text" id="productCategory" placeholder="Kategori" required>
                <input type="number" id="productPrice" placeholder="Harga (RM)" required>
                <button type="submit" id="addBtn">Tambah Produk</button>
            </form>
        </div>

        <hr>

        <div class="table-container">
            <h3>Senarai Produk</h3>
            <table id="productTable">
                <thead>
                    <tr>
                        <th>Nama Produk</th>
                        <th>Kategori</th>
                        <th>Harga (RM)</th>
                        <th>Tindakan</th>
                    </tr>
                </thead>
                <tbody id="productBody">
                    </tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
